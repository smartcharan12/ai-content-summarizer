# Reverse proxy in front of the API (docker compose --profile proxy).
#
# Why: the API has no authentication, and every /summarize call runs a
# 570M-parameter model for seconds of CPU time. Rate limiting per client IP
# keeps one visitor (or bot) from monopolising a small instance.

# 10 summarize requests per minute per IP, bursts of 5 allowed.
limit_req_zone $binary_remote_addr zone=summarize:10m rate=10r/m;
limit_req_status 429;

upstream summarizer_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 256k;      # MAX_INPUT_CHARS is 20k; batches stay well below this
    server_tokens off;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;         # CPU generation can take several seconds

    location /summarize {
        limit_req zone=summarize burst=5 nodelay;
        proxy_pass http://summarizer_api;
    }

    location = / {
        return 302 /ui/;             # humans landing on the IP get the web UI
    }

    location / {
        proxy_pass http://summarizer_api;
    }
}
