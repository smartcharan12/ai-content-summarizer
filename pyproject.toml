# pyproject.toml is the modern (PEP 621) replacement for setup.py.
# `pip install -e .` uses it to install the `summarizer` package from src/
# in editable mode, so `from summarizer...` works everywhere (scripts,
# notebooks, tests, the API) without sys.path hacks.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-summarizer"
version = "0.1.0"
description = "Abstractive dialogue summarization with PEGASUS fine-tuned on SAMSum, served via FastAPI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Charan Teja" }]
# Exact pinned versions live in requirements*.txt; the package itself only
# declares what it imports at runtime.
dependencies = [
    "torch>=2.2",
    "transformers[sentencepiece]>=4.46",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
train = ["datasets>=3.0", "rouge-score>=0.1.2", "tabulate>=0.9", "sacrebleu>=2.4", "accelerate>=1.0", "pandas>=2.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx2>=2.13", "ruff>=0.6", "matplotlib>=3.8", "ipykernel>=6.0", "nbconvert>=7.0"]

[project.scripts]
summarizer-train = "summarizer.pipeline.training_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

# ------------------------------------------------------------------ tooling
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear, UP: modern syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import the top-level `api` package
addopts = "-ra --strict-markers"
markers = [
    "slow: downloads a model or runs real inference (deselect with -m 'not slow')",
]
